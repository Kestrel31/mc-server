version: "3"

# -----------------------------------------------------------------------------
# Java Edition — WITH playit.gg (public access, works behind CGNAT)
#
# Same as docker-compose.java.yml, plus the playit.gg tunnel agent so the
# server is reachable publicly without port forwarding or a static IP.
# See /docs/networking.md for why playit.gg, and how to configure the tunnel.
# -----------------------------------------------------------------------------

services:
  mc:
    image: itzg/minecraft-server
    container_name: mc
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "LATEST"
      MEMORY: "4G"
      MOTD: "My Dockerized Server"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      RCON_PORT: "25575"
      ONLINE_MODE: "TRUE"
    volumes:
      - ../data:/data
    restart: unless-stopped
    tty: true
    stdin_open: true

  rcon-web:
    image: itzg/rcon
    container_name: rcon-web
    ports:
      - "4326:4326"
      - "4327:4327"
    environment:
      RWA_ADMIN: "${RCON_WEB_ADMIN_USER}"
      RWA_PASSWORD: "${RCON_WEB_ADMIN_PASSWORD}"
    volumes:
      - rcon-web-data:/opt/rcon-web-admin/db
    restart: unless-stopped
    depends_on:
      - mc

  mc-backup:
    image: itzg/mc-backup
    container_name: mc-backup
    environment:
      BACKUP_INTERVAL: "6h"
      RCON_HOST: mc
      RCON_PASSWORD: "${RCON_PASSWORD}"
      PRUNE_BACKUPS_DAYS: "7"
    volumes:
      - ../data:/data:ro
      - ../backups:/backups
    restart: unless-stopped
    depends_on:
      - mc

  filebrowser:
    image: filebrowser/filebrowser
    container_name: filebrowser
    ports:
      - "8081:80"
    volumes:
      - ../data:/srv
      - filebrowser-db:/database
    restart: unless-stopped

  mc-monitor:
    image: itzg/mc-monitor
    container_name: mc-monitor
    command: export --host=mc
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - mc

  # Public tunnel agent — outbound-only, works through CGNAT, no port
  # forwarding needed. Set the tunnel's local address in the playit.gg
  # dashboard to `mc:25565` (Docker's internal DNS resolves the service
  # name since this container shares the same Compose network as `mc`).
  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0
    container_name: playit
    environment:
      - SECRET_KEY=${PLAYIT_SECRET_KEY}
    depends_on:
      - mc
    restart: unless-stopped

volumes:
  rcon-web-data:
  filebrowser-db:
