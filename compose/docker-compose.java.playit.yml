version: "3"

# -----------------------------------------------------------------------------
# Java Edition — WITH playit.gg (public access, works behind CGNAT)
#
# Minimal: just the Minecraft server + the playit.gg tunnel agent. No
# backup/file-browser/monitoring sidecars here — use
# docker-compose.java.yml (without playit.gg) if you want those, or run
# both files together (they share the same ../data bind mount) if you
# want sidecars AND public access at the same time:
#   docker compose -f compose/docker-compose.java.yml \
#                   -f compose/docker-compose.java.playit.yml up -d
# See /docs/networking.md for why playit.gg, and how to configure the tunnel.
# -----------------------------------------------------------------------------

services:
  mc:
    image: itzg/minecraft-server
    container_name: mc
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "LATEST"
      MEMORY: "4G"
      MOTD: "My Dockerized Server"
      ONLINE_MODE: "TRUE"
    volumes:
      - ../data:/data
    restart: unless-stopped
    tty: true
    stdin_open: true

  # Public tunnel agent — outbound-only, works through CGNAT, no port
  # forwarding needed. Set the tunnel's local address in the playit.gg
  # dashboard to `mc:25565` (Docker's internal DNS resolves the service
  # name since this container shares the same Compose network as `mc`).
  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0
    container_name: playit
    environment:
      - SECRET_KEY=${PLAYIT_SECRET_KEY}
    depends_on:
      - mc
    restart: unless-stopped
